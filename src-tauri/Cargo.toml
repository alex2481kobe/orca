[package]
name = "orca-desktop"
version = "0.1.0"
description = "Orca desktop shell"
authors = ["Orca contributors"]
license = "Apache-2.0"
repository = "https://github.com/alex2481kobe/orca"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Size-optimized release profile (the default release profile ships symbols and no
# LTO, which is why the iOS Rust static lib/binary were huge). Applies to macOS and
# iOS release builds. These are the standard Tauri size-reduction settings.
[profile.release]
opt-level = "z"      # optimize for size
lto = true           # link-time optimization: dead-code elimination across crates
codegen-units = 1    # maximize cross-unit optimization (slower compile, smaller binary)
panic = "abort"      # drop unwinding tables
strip = true         # strip symbols from the final binary

[lib]
name = "orca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
keyring = "3.6.3"
rand = "0.9.4"
arboard = "3.6.1"
anyhow = "1.0.102"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Native, Chromium-free evidence screenshots in the desktop app (macOS): a
# loopback bridge the Node server calls, backed by WKWebView.takeSnapshot.
[target.'cfg(target_os = "macos")'.dependencies]
tiny_http = "0.12"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
