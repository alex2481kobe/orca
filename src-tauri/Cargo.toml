[package]
name = "orca-desktop"
version = "0.1.0"
description = "Orca desktop shell"
authors = ["Orca contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/alex2481kobe/orca"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "orca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
keyring = "3.6.3"
rand = "0.9.4"
arboard = "3.6.1"
anyhow = "1.0.102"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Native, Chromium-free evidence screenshots in the desktop app (macOS): a
# loopback bridge the Node server calls, backed by WKWebView.takeSnapshot.
[target.'cfg(target_os = "macos")'.dependencies]
tiny_http = "0.12"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
