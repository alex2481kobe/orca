name: codeql
# Reviewed exemption to the "manual-only workflows" policy in SECURITY.md: CodeQL
# is a static analyzer on the safe `pull_request` trigger (NOT pull_request_target),
# so fork PRs run with a read-only token and no secrets — `security-events: write`
# cannot be exercised by a fork. Auto + scheduled scans are the point of code
# scanning, so these triggers are intentional here (and only here).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
