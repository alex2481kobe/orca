name: ci

# Manual-only by policy: the contribution model is intentionally conservative,
# so workflows run only when a maintainer dispatches them. Do not add automatic
# `push`, `pull_request`, `pull_request_target`, or scheduled triggers without
# owner review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify npm guardrails
        run: |
          grep -qx "allow-git=none" .npmrc
          grep -qx "ignore-scripts=true" .npmrc
          grep -qx "save-exact=true" .npmrc
          grep -qx "audit=true" .npmrc
          grep -qx "fund=false" .npmrc

      - name: Verify workflow policy
        run: npm run smoke:workflow-policy

      - name: Install dependencies
        run: npm ci

      - name: Type-check (undefined-name / broken-import gate)
        run: npm run typecheck:imports

      - name: Design tokens (no hardcoded theme colors)
        run: npm run smoke:no-hardcoded-colors

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run security smoke
        run: npm run smoke:security

      - name: Check release ledger
        run: npm run smoke:full-buildout-ledger

      - name: Build web assets
        run: npm run build:web

      - name: Audit production dependencies
        run: npm audit --omit=dev
