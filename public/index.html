<!doctype html>
<html lang="en">

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#10110f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <aside id="sidebar" class="ops-sidebar" aria-label="navigation">
        <div class="sidebar-section sidebar-pair-section">

        </div>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer">

          <a href="https://github.com/alex2481kobe/orca" target="_blank" rel="noreferrer" class="sidebar-link legal-row"><span>Source</span></a>
          <a href="https://github.com/alex2481kobe/orca/blob/main/LICENSE" target="_blank" rel="noreferrer" class="sidebar-link legal-row"><span>AGPL License</span></a>

        <div id="alerts" class="alerts" role="alert"></div>
        <div id="content" class="ops-content" aria-busy="true">Loading…</div>

    </main>
    <script type="module" src="/app.js?v=20260529-setup-wizard"></script>
