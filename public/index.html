<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="/theme-init.js"></script>
    <script src="/sw-boot.js?v=v2-27"></script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#212121" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orca" />
    <meta name="application-name" content="Orca" />
    <title>Orca</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/orca-mark.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css?v=v2-27" />
    <link rel="stylesheet" href="/ui/overview.css?v=v2-27" />
  </head>
  <body data-app="orca">
    <header class="app-topbar">
      <button id="nav-toggle" class="shell-toggle" data-action="toggleNav" type="button" aria-label="Toggle navigation" aria-controls="sidebar"><span class="panel-toggle-icon" aria-hidden="true"></span></button>
      <div id="topbar-title" class="app-topbar-title"></div>
      <div class="app-topbar-actions" aria-hidden="true"></div>
    </header>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
    <main id="shell" class="ops-shell">
      <button id="sidebar-reopen" class="sidebar-reopen" data-action="toggleNav" type="button" aria-label="Open sidebar" title="Open sidebar"><span class="panel-toggle-icon" aria-hidden="true"></span></button>
      <aside id="sidebar" class="ops-sidebar" aria-label="navigation">
        <div class="sidebar-head">
          <div class="sidebar-head-main">
            <a href="#" id="brand-home" class="sidebar-brand-link" aria-label="Orca home" title="Home">
              <img class="sidebar-brand-logo" src="/orca-mark.png" alt="Orca" width="28" height="28" />
            </a>
          </div>
          <button class="sidebar-collapse" data-action="toggleNav" type="button" aria-label="Collapse sidebar" title="Collapse sidebar"><span class="panel-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <div class="sidebar-section sidebar-pair-section">
          <button class="sidebar-pair-button" data-nav="remote" type="button" aria-label="Remote devices">
            <span class="sidebar-pair-icon" aria-hidden="true">⧉</span>
            <span class="sidebar-pair-label">Remote devices</span>
          </button>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Projects</div>
          <div id="sidebar-projects" class="sidebar-list"></div>
        </div>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer">
          <button class="sidebar-link settings-row" data-nav="settings" type="button"><span class="settings-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
        </div>
      </aside>
      <section class="ops-main">
        <div id="content" class="ops-content" aria-busy="true">
          <div class="app-loading" role="status" aria-label="Connecting"><img class="app-loading-logo" src="/orca-mark.png" alt="" width="44" height="44" /><span class="app-loading-spinner" aria-hidden="true"></span><span class="app-loading-text">Connecting…</span></div>
        </div>
      </section>
    </main>
    <script type="module" src="/ui/overview.js?v=v2-27"></script>
  </body>
</html>
